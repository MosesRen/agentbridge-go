name: Go
on: [push, pull_request]
permissions:
  contents: read
jobs:
  claude:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test -race ./claude/...
      - run: go vet ./claude/...
